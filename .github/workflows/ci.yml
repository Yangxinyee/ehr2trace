name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # No patient data anywhere in CI: every test here runs against the fabricated
      # fixtures. The tests that need the real export are marked `realdata` and are
      # deselected, not silently skipped into a green tick.
      - name: Test
        run: pytest tests/ -q -m "not realdata" --durations=10

      - name: Generality guard
        run: pytest tests/test_no_hardcoded_dataset_strings.py -q

      # The experiment records under experiments/results/ are published, and the
      # concept names the terminology experiments rank come from SNOMED CT, LOINC and
      # RxNorm, which cannot be redistributed. A rerun that writes them back fails here.
      - name: Licensed vocabulary strings
        run: python experiments/strip_vocabulary_strings.py --check

      # The paper's central experiment, as a gate: every catalogued fault must still be
      # detected by something.
      - name: Fault detection
        run: pytest tests/integration/test_fault_detection.py -q

      # The other half of that number. A suite that fires on a correct build detects
      # every fault and is worthless, and determinism is claimed in the first sentence
      # of the paper, so both are checked rather than intended.
      - name: Determinism and false alarms
        run: pytest tests/integration/test_reproducibility.py -q

  # A fabricated fixture proves the code runs; it does not prove the MIMIC dataset
  # contract still matches MIMIC. The demonstration subset is 100 patients under an
  # open licence with no credential, so the real thing can be converted here.
  mimic-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch MIMIC-IV demo
        run: |
          wget -q -r -N -c -np -nH --cut-dirs=1 -P data \
            https://physionet.org/files/mimic-iv-demo/2.2/
          test -f data/mimic-iv-demo/2.2/hosp/emar.csv.gz

      - name: Convert and validate
        env:
          MIMICIV_DATA_ROOT: ${{ github.workspace }}/prepared
          EHR_WORK_ROOT: ${{ github.workspace }}/work
          OFFLINE_MODE: "1"
        run: |
          python tools/prepare_mimiciv.py \
            --mimic-root data/mimic-iv-demo/2.2 \
            --out "$MIMICIV_DATA_ROOT/mimiciv"
          for step in inspect ingest identity canonical omop meds; do
            ehr2trace "$step" -d datasets/mimiciv.yaml
          done
          ehr2trace validate --all -d datasets/mimiciv.yaml || true
          ehr2trace validate --all --json -d datasets/mimiciv.yaml > validation.json || true

      # MIMIC-IV mixes unit spellings within a few lab codes, and the converter reports
      # that rather than tuning it away (README, "Try it on open data"), so that one
      # failure is expected here. Any other failing check fails the job, as does the
      # expected one going missing from the run.
      - name: Only the expected checks fail
        run: |
          python - <<'PY'
          import json, sys
          expected = {"UNIT_HOMOGENEOUS_PER_CODE"}
          results = json.load(open("validation.json"))
          ids = {r["check_id"] for r in results}
          failed = {r["check_id"] for r in results if not r["passed"]}
          print(f"{len(results)} checks, failed: {sorted(failed) or 'none'}")
          unexpected = failed - expected
          if unexpected:
              sys.exit(f"unexpected failures: {sorted(unexpected)}")
          if not expected <= ids:
              sys.exit(f"expected checks did not run: {sorted(expected - ids)}")
          for check in sorted(expected - failed):
              print(f"::notice::{check} now passes on MIMIC-IV; remove it from the expected failures")
          PY
