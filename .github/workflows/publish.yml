name: publish

# Publishing a GitHub release builds the package, tests the built wheel and uploads it
# to PyPI. The same release is what Zenodo archives (.zenodo.json), so the PyPI version,
# the Zenodo version and the tag are one thing. PyPI accepts the upload through trusted
# publishing: no token is stored in the repository.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A tag that disagrees with the version the code records would publish one
      # version under another's name, so a release refuses to build.
      - name: Versions agree
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, re, sys, tomllib
          tag = os.environ["TAG"].removeprefix("v")
          found = {
              "tag": tag,
              "pyproject.toml": tomllib.load(open("pyproject.toml", "rb"))["project"]["version"],
              "version.py CODE_VERSION": re.search(r'CODE_VERSION = "([^"]+)"', open("src/ehr2trace/version.py").read()).group(1),
              "CITATION.cff": re.search(r"^version:\s*(\S+)", open("CITATION.cff").read(), re.M).group(1),
          }
          print(found)
          sys.exit(0 if len(set(found.values())) == 1 else "version mismatch")
          PY

      # PyPI renders the README without the repository around it, so links to files in
      # the repository are made absolute for the package page only.
      - name: Absolute links in the package README
        env:
          BASE: https://github.com/${{ github.repository }}/blob/${{ github.event.release.tag_name || github.sha }}/
        run: |
          python - <<'PY'
          import os, re
          base = os.environ["BASE"]
          text = open("README.md", encoding="utf-8").read()
          text = re.sub(
              r"\]\((?!https?://|#|mailto:)([^)\s]+)\)",
              lambda m: "](" + base + m.group(1).removeprefix("./") + ")",
              text,
          )
          open("README.md", "w", encoding="utf-8").write(text)
          PY

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      # The suite runs against the installed wheel, not the source tree: src/ is moved
      # away (conftest.py would otherwise put it first on the path), so a module or a
      # resource the wheel forgot to carry fails here instead of on a user's machine.
      # The two ignored files read src/ehr2trace/validate.py as text; the tests
      # workflow runs them against the source.
      - name: Test the built wheel
        run: |
          python -m pip install dist/*.whl pytest
          mv src src.unused
          pytest tests/ -q -m "not realdata" \
            --ignore=tests/unit/test_validate_columns.py \
            --ignore=tests/unit/test_validate_memory_cap.py
          cd "$RUNNER_TEMP"
          ehr2trace --help > /dev/null
          python -c "from ehr2trace.resources import resource_dir; [print(n, resource_dir(n)) or (resource_dir(n).is_dir() and 'site-packages' in str(resource_dir(n))) or exit(n) for n in ('reference', 'sql', 'prompts', 'datasets')]"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
