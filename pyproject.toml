[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ehr2trace"
version = "0.7.0"
description = "Deterministic local EHR (txt/xlsx) -> OMOP CDM 5.4 + MEDS converter with row-level lineage"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "Xinye Yang", email = "xinye_yang@alumni.brown.edu"}]
keywords = ["OMOP", "MEDS", "EHR", "provenance", "ETL", "clinical"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "polars>=1.0",
    "pyarrow>=17",
    "duckdb>=1.0",
    "openpyxl>=3.1",
    "pydantic>=2.6",
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6",
    # MEDS is pinned exactly: the schema is a data contract, never track main.
    "meds==0.4.1",
]

[project.urls]
Repository = "https://github.com/Yangxinyee/ehr2trace"
Paper = "https://arxiv.org/abs/2609.38193"
Issues = "https://github.com/Yangxinyee/ehr2trace/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3.2"]

[project.scripts]
ehr2trace = "ehr2trace.cli:app"

# The packages are listed rather than discovered so that the four resource directories at
# the repository root can be mapped into the wheel as ehr2trace/_data/<name>; resources.py
# reads them there when installed and from the repository root in a checkout. A new
# subpackage under src/ehr2trace has to be added here, and the publish workflow's
# installed-wheel test fails if one is missing.
[tool.setuptools]
packages = [
    "ehr2trace",
    "ehr2trace.adapters",
    "ehr2trace.canonical",
    "ehr2trace._data.datasets",
    "ehr2trace._data.prompts",
    "ehr2trace._data.reference",
    "ehr2trace._data.reference.plausible_ranges",
    "ehr2trace._data.reference.units",
    "ehr2trace._data.sql",
]

[tool.setuptools.package-dir]
"" = "src"
"ehr2trace._data.datasets" = "datasets"
"ehr2trace._data.prompts" = "prompts"
"ehr2trace._data.reference" = "reference"
"ehr2trace._data.sql" = "sql"

[tool.setuptools.package-data]
"ehr2trace._data.datasets" = ["*.yaml"]
"ehr2trace._data.prompts" = ["*.md"]
"ehr2trace._data.reference" = ["*.csv"]
"ehr2trace._data.reference.plausible_ranges" = ["*.csv"]
"ehr2trace._data.reference.units" = ["*.csv"]
"ehr2trace._data.sql" = ["**/*.sql", "**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Several integration modules import a sibling for its fixture setup, so the
# repository root has to be importable. `python -m pytest` puts it on sys.path
# and the bare `pytest` CI runs with does not, which is how this stayed green
# locally while every CI run failed at collection.
pythonpath = ["."]
markers = [
    "realdata: requires EHR_DATA_ROOT with the real read-only export",
    "slow: full-dataset scans",
]
