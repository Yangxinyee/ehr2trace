[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ehr2cdm"
version = "0.3.0"
description = "Deterministic local EHR (txt/xlsx) -> OMOP CDM 5.4 + MEDS converter with row-level lineage"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyarrow>=17",
    "duckdb>=1.0",
    "openpyxl>=3.1",
    "pydantic>=2.6",
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6",
    # MEDS is pinned exactly: the schema is a data contract, never track main.
    "meds==0.4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ehr2cdm = "ehr2cdm.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "realdata: requires EHR_DATA_ROOT with the real read-only export",
    "slow: full-dataset scans",
]
