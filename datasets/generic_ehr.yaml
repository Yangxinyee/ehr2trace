# Synthetic generalization fixture (checklist P5-2).
#
# Structurally unlike the reference export: comma-separated, no byte-order marks,
# different column names for every role, one file per domain, two sites instead of
# cohort partitions, and no anchor concept at all.
#
# Onboarding it cost exactly this file. If it had cost a code change, the design's
# claim of generality would be false, and this fixture exists to keep that honest.

dataset_id: generic_ehr
root_env: GENERIC_EHR_ROOT
description: Synthetic two-site EHR used to prove a new source needs only a new YAML.

identity:
  person_key: patient_ref
  encounter_key: visit_ref

time:
  # Synthetic data, so the zone is genuinely known rather than assumed.
  timezone_assumption: UTC
  naive_time_policy: block
  formats:
    - "%Y-%m-%d %H:%M:%S"
    - "%Y-%m-%d"
  null_literals: ["NULL"]

partitions:
  - {id: site_a, dir: site_a}
  - {id: site_b, dir: site_b}

sources:

  patients:
    adapter: delimited
    file_glob: "patients.csv"
    options: {delimiter: ",", encoding: "utf-8", quoting: minimal}
    shape: person_attributes
    event_kind: demographic
    required: true
    fields:
      person_id:  {from: [patient_ref], required: true}
      gender:     {from: [birth_sex]}
      race:       {from: [ancestry]}
      ethnicity:  {from: [ethnic_group]}
      age:        {from: [years_old]}
      death_time: {from: [deceased_on]}
    untimed_values:
      - {column: body_mass_index, code: BMI, unit: "kg/m2"}
    expected_quarantine:
      UNTIMED_CLINICAL_VALUE:
        max_share: 1.0
        reason: >-
          A patient table has one row per patient and no measurement time, so a body
          mass index on it is untimed by construction. It is quarantined rather than
          dated from anything, and the share is however many patients carry one.

  encounters:
    adapter: delimited
    file_glob: "encounters.csv"
    options: {delimiter: ",", encoding: "utf-8", quoting: minimal}
    shape: visit
    event_kind: visit
    required: false
    fields:
      person_id:      {from: [patient_ref], required: true}
      encounter_id:   {from: [visit_ref]}
      event_time:     {from: [admitted_at, service_on], required: true}
      length_of_stay: {from: [stay_days]}
      visit_type:     {from: [visit_class]}
      death_time:     {from: [deceased_on]}

  diagnoses:
    adapter: delimited
    file_glob: "diagnoses.csv"
    options: {delimiter: ",", encoding: "utf-8", quoting: minimal}
    shape: point_event
    event_kind: condition
    code_system: ICD10CM
    required: false
    fields:
      person_id:   {from: [patient_ref], required: true}
      source_code: {from: [dx_code], required: true}
      source_name: {from: [dx_label]}
      event_time:  {from: [noted_on], required: true}
      status:      {from: [dx_state]}

  orders:
    adapter: delimited
    file_glob: "orders.csv"
    options: {delimiter: ",", encoding: "utf-8", quoting: minimal}
    shape: point_event
    event_kind: drug_order
    required: false
    fields:
      person_id:    {from: [patient_ref], required: true}
      encounter_id: {from: [visit_ref]}
      source_code:  {from: [drug_label], required: true}
      source_name:  {from: [drug_label]}
      dose:         {from: [amount]}
      event_time:   {from: [ordered_at], required: true}
      status:       {from: [order_state]}
    expected_quarantine:
      MISSING_EVENT_TIME:
        max_share: 0.25
        reason: >-
          One order in the fixture was written with no ordering time, the way a real
          order entered on paper and keyed in later arrives. It is a property of the
          delivery, and an order with no time is quarantined rather than dated.
    ignored_columns:
      # Trap 11 (plan T1.12): a delivered column no role reads. RAW_COVERAGE_DECLARED
      # fails on it until it is named here with the reason it is left alone.
      order_channel: >-
        how the order was entered, electronically or verbally: a fact about the ordering
        workflow rather than the drug, and no OMOP or MEDS field holds it

  administrations:
    adapter: delimited
    file_glob: "administrations.csv"
    options: {delimiter: ",", encoding: "utf-8", quoting: minimal}
    shape: point_event
    event_kind: drug_admin
    required: false
    fields:
      person_id:    {from: [patient_ref], required: true}
      encounter_id: {from: [visit_ref]}
      event_time:   {from: [given_at], required: true}
      source_code:  {from: [drug_label], required: true}
      source_name:  {from: [drug_label]}
      dose:         {from: [amount]}
      route:        {from: [given_route]}

  results:
    adapter: delimited
    file_glob: "results.csv"
    options: {delimiter: ",", encoding: "utf-8", quoting: minimal}
    shape: point_event
    event_kind: measurement
    required: false
    fields:
      person_id:      {from: [patient_ref], required: true}
      encounter_id:   {from: [visit_ref]}
      event_time:     {from: [observed_at, released_at], required: true}
      available_time: {from: [released_at]}
      source_code:    {from: [analyte], required: true}
      source_name:    {from: [analyte_label]}
      value:          {from: [result]}
      unit:           {from: [units]}
    # Trap 4 (plan T1.12, decision D-R1). The unit column says Celsius on every
    # temperature row and the values are Fahrenheit, the way one export wrote its body
    # temperatures: a median of 98 under a Celsius label. The source's string stays in
    # `unit_source`; normalization reads the values as [degF], converts them to Cel and
    # flags UNIT_OVERRIDDEN. One reading is Celsius after all -- 37.2 among readings of
    # 98 -- and converts to a temperature nobody has, which the plausible range withholds.
    unit_override:
      TEMP: "[degF]"

  reports:
    adapter: delimited
    file_glob: "reports.csv"
    options: {delimiter: ",", encoding: "utf-8", quoting: minimal}
    shape: narrative_lines
    event_kind: note
    study_event_kind: procedure
    required: false
    fields:
      person_id:      {from: [patient_ref], required: true}
      encounter_id:   {from: [visit_ref]}
      display_name:   {from: [study_label], required: true}
      event_time:     {from: [produced_at], required: true}
      available_time: {from: [produced_at]}
      text_line:      {from: [line_no]}
      text:           {from: [line_text]}

  study_components:
    adapter: delimited
    file_glob: "study_components.csv"
    options: {delimiter: ",", encoding: "utf-8", quoting: minimal}
    shape: component_measurements
    event_kind: measurement
    study_event_kind: procedure
    required: false
    fields:
      person_id:      {from: [patient_ref], required: true}
      encounter_id:   {from: [visit_ref]}
      display_name:   {from: [study_label], required: true}
      event_time:     {from: [resulted_at], required: true}
      available_time: {from: [resulted_at]}
      source_code:    {from: [component], required: true}
      text_line:      {from: [line_no]}
      value:          {from: [component_value]}

  # Trap 5 (plan T1.12, decision D-R2). Whole notes, one per row, where one note's text is
  # filed under two encounter ids: under the admission the other tables know and under an
  # id none of them carries, or under two such ids. The copies are one note, so the
  # encounter leaves the identity; the merge keeps the encounter whose row is marked as
  # seen elsewhere (`visit_known`, the lookup a preparation step writes), or keeps none
  # and flags ENCOUNTER_UNLINKED. Without that, the text is published once per id, which
  # NOTE_TEXT_UNIQUE fails.
  notes:
    adapter: delimited
    file_glob: "notes.csv"
    options: {delimiter: ",", encoding: "utf-8", quoting: minimal}
    shape: point_event
    event_kind: note
    value_expect: text
    required: false
    encounter_in_identity: false
    merge_rules:
      encounter_id: {rule: prefer_linked}
    fields:
      person_id:        {from: [patient_ref], required: true}
      encounter_id:     {from: [visit_ref]}
      source_code:      {from: [note_type], required: true}
      source_name:      {from: [note_type]}
      event_time:       {from: [written_on], required: true}
      text:             {from: [note_text]}
      encounter_linked: {from: [visit_known]}

  # Trap 6 (plan T1.12, decision D-R3). One procedure billed twice, a facility and a
  # professional charge for the same service. It is one procedure: both rows stay in the
  # lineage and the event is flagged BILLING_DUPLICATE, so nothing publishes a quantity of
  # two. The bill type is kept for a reader, and a kept column that differs between the
  # copies of one fact needs a rule, or DUPLICATES_AGREE fails.
  procedures:
    adapter: delimited
    file_glob: "procedures.csv"
    options: {delimiter: ",", encoding: "utf-8", quoting: minimal}
    shape: point_event
    event_kind: procedure
    required: false
    fields:
      person_id:    {from: [patient_ref], required: true}
      encounter_id: {from: [visit_ref]}
      source_code:  {from: [procedure_code], required: true}
      source_name:  {from: [procedure_label]}
      event_time:   {from: [performed_at], required: true}
    keep_columns: [bill_type]
    merge_rules:
      bill_type: {rule: keep_all_flag, flag: BILLING_DUPLICATE}

  # Trap 7 (plan T1.12, decision D-R4). Intensive-care stays recorded by the day they began
  # and a fractional length, where two stays began on the same day. They are two stays, so
  # the length of stay is part of the identity. The table names no encounter, so each stay
  # is placed under the admission that contains its start.
  icu_stays:
    adapter: delimited
    file_glob: "icu_stays.csv"
    options: {delimiter: ",", encoding: "utf-8", quoting: minimal}
    shape: visit
    event_kind: visit_detail
    required: false
    identity_extra_fields: [length_of_stay]
    fields:
      person_id:      {from: [patient_ref], required: true}
      event_time:     {from: [entered_on], required: true}
      length_of_stay: {from: [stay_days]}
      visit_type:     {from: [care_unit]}

  # Trap 2 (plan T1.12). A vital-sign table delivered wide, one column per sign, and
  # declared as though it were long: a component name and a value on every row. It has
  # neither, so the shape quarantines every row for having no component name and the
  # source yields no event -- the state one export's emergency-department vital signs
  # were published in, counted as present because their rows were parsed. The emptiness
  # is declared rather than silent: SOURCE_YIELDS_EVENTS fails on this source unless
  # `expected_empty` says why.
  vitals_wide:
    adapter: delimited
    file_glob: "vitals_wide.csv"
    options: {delimiter: ",", encoding: "utf-8", quoting: minimal}
    shape: component_measurements
    event_kind: measurement
    required: false
    fields:
      person_id:    {from: [patient_ref], required: true}
      encounter_id: {from: [visit_ref]}
      event_time:   {from: [charted_at], required: true}
      source_code:  {from: [vital_name]}
      value:        {from: [vital_value]}
    expected_empty: >-
      The table is wide, one column per vital sign, and this declaration reads rows of a
      component name and a value that it does not have. Every row is quarantined for
      having no component name until a preparation step melts the table into such rows.
    expected_quarantine:
      UNPARSEABLE_VALUE:
        max_share: 1.0
        reason: >-
          Every row of the wide table lacks the component name the declared shape needs,
          so the share is the whole table by construction.
    ignored_columns:
      heart_rate: "a vital sign held as a column of the wide table; no shape reads a column as a component"
      resp_rate: "a vital sign held as a column of the wide table; no shape reads a column as a component"
      spo2_pct: "a vital sign held as a column of the wide table; no shape reads a column as a component"
      temp_f: "a vital sign held as a column of the wide table; no shape reads a column as a component"

# No anchors block: this source has no anchor concept, and the pipeline must not
# require one.

labels: []

omop:
  backend: duckdb
  cdm_version: "5.4"
  person_birth_policy:
    mode: approved_approximation
    age_as_of_date: "2022-01-01"
    approval_note: "synthetic fixture: ages are generated as of 2022-01-01"
  source_name: generic_ehr
  cdm_holder: "synthetic fixture; no holder"
  source_release_date: "2026-08-20"

meds:
  splits: [["train", 0.6], ["tuning", 0.2], ["held_out", 0.2]]
  split_salt: "generic_ehr/meds-split/v1"

execution:
  bucket_count: 4
  workers: 2
  chunk_rows: 1000

owner_answers:
  batch_relationship: "two independent sites; a patient may appear at both"
  imaging_reports_included: true
  vocabulary_source: "none: synthetic fixture, concept ids stay 0"
  answered_by: "fixture author"
  answered_on: "2026-08-20"
