# Synthetic fixture for behaviour that depends on the dataset's clock (plan T1.12, trap 3).
#
# The other two fixtures declare UTC, and under UTC a local calendar day is the UTC day,
# so the case that withheld 11,402 deaths from one real export cannot happen in them: a
# death recorded as a date in one table and as an evening hour in another, whose instant
# falls on the next UTC day. This dataset exists to hold that case, and beside it a pair
# recorded on two different local days. Its clock is New York's, so an evening hour
# crosses midnight UTC, and it is deliberately small: one site, two tables, three invented
# patients. Nothing else depends on it, so nothing else moves when its clock does.

dataset_id: zoned_site
root_env: ZONED_SITE_ROOT
description: >-
  Synthetic single-site extract on a non-UTC clock, for the behaviour that depends on the
  dataset's time zone.

identity:
  person_key: patient_ref
  encounter_key: visit_ref

time:
  # Synthetic data, so the zone is genuinely known rather than assumed.
  timezone_assumption: America/New_York
  naive_time_policy: block
  formats:
    - "%Y-%m-%d %H:%M:%S"
    - "%Y-%m-%d"
  null_literals: ["NULL"]

partitions:
  - {id: site, dir: site}

sources:

  # One row per patient. A death is recorded as a date, the way a registry records it.
  patients:
    adapter: delimited
    file_glob: "patients.csv"
    options: {delimiter: ",", encoding: "utf-8", quoting: minimal}
    shape: person_attributes
    event_kind: demographic
    required: true
    fields:
      person_id:  {from: [patient_ref], required: true}
      gender:     {from: [birth_sex]}
      age:        {from: [years_old]}
      death_time: {from: [died_on]}

  # One row per admission. A death in hospital is recorded to the minute.
  admissions:
    adapter: delimited
    file_glob: "admissions.csv"
    options: {delimiter: ",", encoding: "utf-8", quoting: minimal}
    shape: visit
    event_kind: visit
    required: true
    fields:
      person_id:    {from: [patient_ref], required: true}
      encounter_id: {from: [visit_ref]}
      event_time:   {from: [admitted_at], required: true}
      end_time:     {from: [left_at]}
      visit_type:   {from: [visit_class]}
      death_time:   {from: [died_at]}

labels: []

omop:
  backend: duckdb
  cdm_version: "5.4"
  person_birth_policy:
    mode: approved_approximation
    age_as_of_date: "2022-01-01"
    approval_note: "synthetic fixture: ages are generated as of 2022-01-01"
  source_name: zoned_site
  cdm_holder: "synthetic fixture; no holder"
  source_release_date: "2026-09-14"

meds:
  splits: [["train", 0.6], ["tuning", 0.2], ["held_out", 0.2]]
  split_salt: "zoned_site/meds-split/v1"

execution:
  bucket_count: 2
  workers: 1
  chunk_rows: 1000

owner_answers:
  batch_relationship: "one synthetic site and one extract"
  imaging_reports_included: false
  vocabulary_source: "none: synthetic fixture, concept ids stay 0"
  answered_by: "fixture author"
  answered_on: "2026-09-14"
