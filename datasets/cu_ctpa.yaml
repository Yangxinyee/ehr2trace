# Dataset contract for the CU CTPA export (design section 4).
#
# A second hospital, a second Epic extract, and structurally unlike the reference one:
# comma-separated CSV instead of tab-delimited text plus workbooks, surrogate person and
# encounter ids instead of MRN/CSN, one cohort instead of four labelled partitions, a
# per-patient CT timestamp where the reference export had a per-row "closest to CT"
# rank, and free-text clinical notes -- ED notes, H&P, discharge summaries -- which the
# reference export does not contain at all.
#
# The flat CSVs are already the shape ehr2trace ingests; tools/prepare_cu.py closes
# the gaps a config must not close itself -- projections and lookups only -- and
# records a hash manifest across the boundary, with every row it drops counted and
# named. See that script's docstring.

dataset_id: cu_ctpa
root_env: CU_CTPA_DATA_ROOT
description: >-
  University of Colorado CT pulmonary angiography cohort: 127,955 patients scanned
  2013-12-29 to 2025-07-31, delivered as ten flat CSVs plus 553 GB of DICOM/NIfTI.

identity:
  # Surrogate keys assigned by the extract, not hospital identifiers. The salt still
  # applies: subject_id must not be reversible to the export's own id either.
  person_key: arb_person_id
  encounter_key: arb_encounter_id
  subject_salt_env: EHR_SUBJECT_SALT

time:
  # `CTA_timestamp` is the only column in the export that names a zone, and it says UTC;
  # every other date arrives bare. Measured 2026-09-12 (D15): pairing each scan with the
  # same patient's vital signs puts the offset between them at -1 to +1 hours, median
  # -32 minutes, and the -6 and -7 hour bins a mountain-time conversion would produce
  # hold about a tenth of the peak. The two columns are on one clock, so the suffix
  # labels that column rather than converting it, and America/Denver -- the hospital's
  # zone -- is what both carry. See owner_answers.utc_suffix_on_the_cta_timestamp.
  timezone_assumption: America/Denver
  naive_time_policy: block
  formats:
    - "%Y-%m-%d %H:%M:%S.%f"
    - "%Y-%m-%d %H:%M:%S"
    - "%Y-%m-%dT%H:%M:%S.%f"
    - "%Y-%m-%dT%H:%M:%S"
    - "%Y-%m-%d"
  null_literals: ["", "NULL", "None", "No matching concept"]

partitions:
  # One cohort, one extract. No has/no split: whether a patient had a pulmonary embolism
  # is a claim the diagnosis codes make, not a claim a directory name makes.
  - id: "cu_ctpa"
    dir: "cu_ctpa"
    membership_label: null
    batch: "C4225"

terminology:
  # Site markers this export writes inside a medication name: `(SUPER MED)` and
  # `(PVHS)` name the site that dispensed, not the drug. Left in the string they
  # stop the ingredient from being recognised (2026-09-11).
  drug_name_noise:
    # Site markers this hospital writes into the product name.
    - SUPER MED
    - PVHS
    - MHS
    - CHCO
    # Who sets the dose, not what the drug is: a warfarin order handed to the pharmacist
    # names warfarin, and the dose stays in the event's own field, so reading these as
    # the ingredient loses nothing (D14, 2026-09-12).
    - PHARMACY TO DOSE
    - PER PHARMACY
    - PER PHYSICIAN
    # The route, written where a product name goes. `HALF-TAB` is deliberately absent:
    # it marks a dose obtained by splitting a tablet, and stripping it would let
    # `WARFARIN 500 MCG TAB (HALF-TAB)` match the 0.5 mg product that was never
    # dispensed. Those names are mapped to their ingredient by hand instead.
    - PO

sources:

  # -- person ---------------------------------------------------------------------
  demographics:
    adapter: parquet
    file_glob: "demographics.parquet"
    shape: person_attributes
    event_kind: demographic
    required: true
    fields:
      person_id:    {from: [arb_person_id], required: true}
      birth_date:   {from: [birth_date]}
      age:          {from: [age]}
      gender:       {from: [sex]}
      race:         {from: [race]}
      ethnicity:    {from: [ethnicity]}
      vital_status: {from: [vital_status]}
      death_time:   {from: [death_date]}
      # The CT the cohort was assembled around. Provenance, never an event: nothing in
      # this extract says what the scan showed.
      anchor_time:  {from: [cta_time]}
    untimed_values:
      # "BMI closest to the first inclusion procedure" -- a real measurement whose own
      # time the export dropped. Quarantined rather than dated by the CT's timestamp.
      - {column: bmi, code: BMI, unit: "kg/m2"}
    expected_quarantine:
      UNTIMED_CLINICAL_VALUE:
        max_share: 1.0
        reason: >-
          W2 (2026-09-13): every BMI this export delivers is the one closest to the
          first inclusion procedure, with no time of its own -- 124,367 of 127,955
          rows carry one -- so every one is quarantined rather than dated by the CT.
          The source's shape, not a conversion fault.
    ignored_columns:
      mrn: >-
        the hospital's medical record number, delivered beside the export's own
        surrogate id; identity is arb_person_id, and an MRN must reach no output
      age_reference_day: >-
        provenance written by tools/prepare_cu.py: the day the age was current at,
        from which it derived birth_date; the prepare manifest counts the rows under
        each rule
      age_reference_source: >-
        provenance written by tools/prepare_cu.py: which rule dated the age
        (cta_timestamp for 127,952 rows, earliest_flowsheet_day for 3; D12)

  # -- vitals ---------------------------------------------------------------------
  flowsheets:
    adapter: parquet
    file_glob: "flowsheets.parquet"
    shape: point_event
    event_kind: measurement
    required: true
    # Five flowsheet rows, 42 in all, are not vital signs this cohort can use: a
    # maternal respiration prompt (12 rows), a home pulse-oximetry questionnaire item
    # (6), two "Post" pressures (5 each) that nothing says are post what, and
    # `Respirations` (14), a `Custom List` row whose values are the option numbers 3
    # and 4 and not breaths per minute (P-CU9). Dropped by name (D11, 2026-09-11;
    # Respirations added 2026-09-14). An earlier version of this comment said the Post
    # BP rows lacked the `Blood Pressure` value_type; they carry it and were split like
    # the others (P-CU11) -- what excludes them is the unmappable "Post".
    row_filter: {column: flowsheet_row_name, drop: ["Maternal Respirations:", "7. Personal Pulse Oximetry", "Post BP systolic", "Post BP diastolic", "Respirations"]}
    # Blood pressure arrives as one cell, "135/76". It is not split here: splitting one
    # recorded observation into two asserts that the source recorded two, which is a
    # declaration to make in the open, not a regex in a converter. tools/prepare_cu.py
    # makes it, on the source's own `value_type = 'Blood Pressure'` rows and only where
    # the cell is exactly `N/N`, and its manifest says how many rows that added.
    unit_override:
      # D-R1 (2026-09-13). The unit column says "degree Celsius" on every temperature
      # row, and for these two rows the values are Fahrenheit: of 67,660 `Temp`
      # values 67,604 lie in 90-110 and 13 in 30-45, median 98.0; all 90 `Core (Body)
      # Temperature` values lie in 90-110, median 98.2 (P-CU2). `Temp (in Celsius)`
      # (59,953 values, median 36.7, 59,941 in 30-45) is what its unit says and is not
      # overridden. The source string stays in unit_source; normalization reads these
      # as [degF], converts to Cel and flags UNIT_OVERRIDDEN. Put to the data owner
      # for confirmation (plan section 3.3), executed meanwhile.
      "Temp": "[degF]"
      "Core (Body) Temperature": "[degF]"
    fields:
      person_id:    {from: [arb_person_id], required: true}
      encounter_id: {from: [arb_encounter_id]}
      event_time:   {from: [observed_at], required: true}
      source_code:  {from: [flowsheet_row_name], required: true}
      source_name:  {from: [flowsheet_row_name]}
      value:        {from: [value]}
      unit:         {from: [unit]}
    # The source's own type label for the row (Numeric Type, Blood Pressure,
    # Temperature, Custom List): what the preparation step split blood pressure on,
    # kept so a reader can see it beside every value.
    keep_columns: [value_type]

  # -- conditions -----------------------------------------------------------------
  diagnoses:
    adapter: parquet
    file_glob: "diagnoses.parquet"
    shape: point_event
    event_kind: condition
    code_system: ICD10CM
    required: true
    # `diagnosis_date` runs from 1956 to the extraction date. The early rows are
    # historical problem-list entries carried into Epic, not encounters; they are kept
    # as recorded and the observation-period rule is what keeps them honest.
    fields:
      person_id:    {from: [arb_person_id], required: true}
      encounter_id: {from: [arb_encounter_id]}
      event_time:   {from: [diagnosis_date], required: true}
      source_code:  {from: [code], required: true}
      source_name:  {from: [code_description]}
    ignored_columns:
      code_type: >-
        constant ICD10CM on all 5,398,425 rows (measured 2026-09-14); the source
        declares code_system ICD10CM, so the column repeats it

  # -- procedures -----------------------------------------------------------------
  # Two sources rather than one because code_system is a property of the source: a CPT4
  # code and an ICD-10-PCS code that spell the same are not the same code.
  procedures_cpt:
    adapter: parquet
    file_glob: "procedures.parquet"
    shape: point_event
    event_kind: procedure
    code_system: CPT4
    required: true
    row_filter: {column: code_type, keep: [CPT4]}
    # D-R3 (2026-09-13). 97,183 groups of rows (97,205 rows beyond the first) are the
    # same patient, encounter, day and CPT code billed twice: once by the hospital
    # (`HB CHG ...`) and once professionally (`PR ...`, `MEDICINE`, `EM ...`), 55,120
    # of them a 93306 echocardiogram (P-CU7). One service, two bills: one event, both
    # rows in the lineage, flagged BILLING_DUPLICATE, and no quantity of two published.
    merge_rules:
      procedure_name:     {rule: keep_all_flag, flag: BILLING_DUPLICATE}
      procedure_category: {rule: keep_all_flag, flag: BILLING_DUPLICATE}
    fields:
      person_id:    {from: [arb_person_id], required: true}
      encounter_id: {from: [arb_encounter_id]}
      event_time:   {from: [procedure_start_date], required: true}
      end_time:     {from: [procedure_end_date]}
      source_code:  {from: [code], required: true}
      source_name:  {from: [code_description, procedure_name]}
    keep_columns: [procedure_category, procedure_name]

  procedures_pcs:
    adapter: parquet
    file_glob: "procedures.parquet"
    shape: point_event
    event_kind: procedure
    code_system: ICD10PCS
    required: false
    row_filter: {column: code_type, keep: [ICD10PCS]}
    fields:
      person_id:    {from: [arb_person_id], required: true}
      encounter_id: {from: [arb_encounter_id]}
      event_time:   {from: [procedure_start_date], required: true}
      end_time:     {from: [procedure_end_date]}
      source_code:  {from: [code], required: true}
      source_name:  {from: [code_description, procedure_name]}
    keep_columns: [procedure_category, procedure_name]

  # -- medications ----------------------------------------------------------------
  medications:
    adapter: parquet
    file_glob: "medications.parquet"
    shape: point_event
    event_kind: drug_order
    required: true
    # Ordering intent. This export carries no administration table at all, so nothing
    # here is evidence that a drug reached a patient, and no source is declared
    # drug_admin. `order_status` is kept as recorded.
    #
    # The identity of a drug order (hash rule 2) carries the dose, unit, route, status
    # and end time, and 8,445 groups of rows here still agree on all of those and
    # differ in the frequency (4,458 groups) or in a dispensing column (4,939)
    # (measured 2026-09-14 on the prepared table; P-CU1). An order of the same drug and
    # dose at a different frequency is a different order. T7 carries no order id, so
    # tools/prepare_cu.py writes `order_record_key`, a digest of the row's own columns,
    # and it is declared as the record's sequence number: rows identical in every
    # delivered column collapse to one event, rows that differ anywhere stay apart,
    # and the prepare manifest counts the repeats.
    fields:
      person_id:    {from: [arb_person_id], required: true}
      encounter_id: {from: [arb_encounter_id]}
      event_time:   {from: [start_date], required: true}
      end_time:     {from: [end_date]}
      source_code:  {from: [medication_name], required: true}
      source_name:  {from: [medication_name]}
      dose:         {from: [ordered_dose]}
      # T2.CU1 (P-CU3). 3,571,793 of 4,206,761 rows carry a dose unit -- mg 1,420,563,
      # Units 1,158,072, Units/kg/hr 418,259, ... -- and until 2026-09-13 it was only
      # kept, so every published dose was a bare number. `*Unspecified` (428,344 rows)
      # is the export's placeholder and stays unmapped in reference/units/cu_ctpa.csv.
      unit:         {from: [dose_unit]}
      route:        {from: [route]}
      status:       {from: [order_status]}
      sequence_number: {from: [order_record_key]}
    keep_columns:
      - therapeutic_class
      - pharmaceutical_class
      - pharmaceutical_subclass
      - form
      - ordered_frequency
      # T2.CU8 (P-CU8). `dispensed_quantity` (834,932 rows) with `quantity_unit`
      # (1,430,902 rows, 1,081,075 of them '*Not Applicable') is the amount dispensed
      # against the order -- what OMOP's drug_exposure.quantity means -- and
      # `number_of_doses` (244,181 rows, median 1) how many doses the order covers.
      # None of the three is a dose, a unit or a time, so none has a canonical field;
      # they are kept whole in the source layer rather than ignored, so a publisher
      # that learns to fill `quantity` reads them from there.
      - number_of_doses
      - dispensed_quantity
      - quantity_unit

  # -- notes ----------------------------------------------------------------------
  notes:
    adapter: parquet
    file_glob: "notes.parquet"
    shape: point_event
    event_kind: note
    value_expect: text
    required: false
    # One row is one whole note, so this is a point event carrying text -- the same
    # declaration MIMIC-IV's notes use. `narrative_lines` is the wrong shape here: it
    # groups rows into one document by (subject, encounter, title, time), which is
    # right when a report arrives one line per row and wrong when each row is already a
    # whole note. On this export that grouping merged 2 to 7 genuinely different notes
    # into one event for 9,156 of 52,102 groups.
    #
    # No sequence number is declared, and that is deliberate. The note text is part of
    # the event's identity, so two different notes on one day stay two events, while the
    # same note appearing in more than one pull -- 1,427,559 identical note groups span
    # the three files -- collapses to one event with every source row still linked. A
    # row-order discriminator would defeat exactly that.
    #
    # The encounter id is not part of the identity either (D-R2, 2026-09-13). 491,192
    # groups of notes are the same patient, day, type and full text filed under
    # different arb_encounter_ids (P-CU4), and those ids are mostly unknown to every
    # other table: of the notes' 163,612 (patient, encounter) pairs, 4,293 (2.6%) occur
    # in diagnoses, medications, flowsheets or procedures, against 65.6% of the
    # medications' pairs (P-CU12). tools/prepare_cu.py looks each pair up and writes
    # `encounter_linked`; the merge keeps the one encounter id of a group that is
    # linked, otherwise none, flagged ENCOUNTER_UNLINKED.
    #
    # `note_date` is a date with no time. Every note in a day therefore lands at local
    # midnight, and an availability-aware model must not read that as "known at 00:00".
    # The time component is missing in the source and is not invented here.
    encounter_in_identity: false
    merge_rules:
      encounter_id: {rule: prefer_linked}
    expected_encounter_link_rate:
      # 2.6% of the notes' (patient, encounter) pairs, 2.0% of note rows on the 1-in-200
      # sample of 2026-09-14 (338 of 16,977): the floor sits under both readings.
      min_rate: 0.015
      reason: >-
        P-CU12: the notes' encounter ids are the source's and almost none of them occur
        in any other table of this export (4,293 of 163,612 pairs); not a conversion
        fault, and no encounter table was delivered to resolve them against.
    fields:
      person_id:    {from: [arb_person_id], required: true}
      encounter_id: {from: [arb_encounter_id]}
      source_code:  {from: [NoteType], required: true}
      source_name:  {from: [NoteType]}
      event_time:   {from: [note_date], required: true}
      text:         {from: [NoteText]}
      # '1' when the row's (patient, encounter) pair occurs in diagnoses, medications,
      # flowsheets or procedures; a lookup the preparation step made, read by the
      # prefer_linked rule above and by nothing else.
      encounter_linked: {from: [encounter_linked]}
    keep_columns: [AuthorService, note_author, source_file]

  # -- outcomes as visits ---------------------------------------------------------
  icu_stays:
    adapter: parquet
    file_glob: "icu_stays.parquet"
    shape: visit
    event_kind: visit_detail
    required: false
    # `visit_type` is a constant the preparation step projects from the table's own
    # identity -- see tools/prepare_cu.py. An ICU stay inside a hospitalisation is a
    # VISIT_DETAIL and not a VISIT_OCCURRENCE, and since D-R14 (2026-09-13) there is a
    # visit_detail publisher: the shape stays `visit`, the kind is visit_detail, and
    # the constant still resolves to 32037 Intensive Care through mappings/visit.csv.
    # T5 carries no arb_encounter_id, so a stay is parented by time containment in
    # the same patient's visits, and the only visits this export has are readmission
    # dates with no end -- so most stays will be unparented and reported as
    # VISIT_DETAIL_UNPARENTED, which is the truth of this delivery, rather than
    # attached to a hospitalisation that was not delivered.
    #
    # `icu_start_date` is a date; `icu_los` carries a fraction of a day. 176 start
    # dates carry more than one length of stay (177 rows beyond the first), the
    # lengths 0.25-9.9 days apart (P-CU6): two stays that began the same day, not one
    # stay recorded twice (D-R4), so the length of stay is part of the identity and
    # each row is its own stay.
    identity_extra_fields: [length_of_stay]
    fields:
      person_id:      {from: [arb_person_id], required: true}
      event_time:     {from: [icu_start_date], required: true}
      length_of_stay: {from: [icu_los]}
      visit_type:     {from: [visit_type]}

  readmissions:
    adapter: parquet
    file_glob: "readmissions.parquet"
    shape: visit
    event_kind: visit
    required: false
    # No `visit_type`. `readmission_date` says a readmission happened on that date and
    # never that it was an inpatient one, so the visit concept stays 0 -- an honest
    # "the source did not say" rather than an invented Inpatient Visit.
    #
    # The 7/30/90/180/365-day flags are the export's own derivations. They are kept in
    # the source layer as attributes and never become events: a flag is a label someone
    # computed, not something that happened to the patient at a time. What they were
    # computed against is inferred, not stated -- see owner_answers.readmission_index_event:
    # one row per admission x CTPA scan, the scan column dropped on export, so an
    # admission date can carry several flag vectors here, of which the one for the first
    # scan recomputes from cta_time.
    fields:
      person_id:  {from: [arb_person_id], required: true}
      event_time: {from: [readmission_date], required: true}
    keep_columns:
      - readmission_flag_7day
      - readmission_flag_30day
      - readmission_flag_90day
      - readmission_flag_6months
      - readmission_flag_1year

anchors:
  anchor_type: ctpa
  from_field: anchor_time
  # The CT timestamp carries a time, so anchors could be compared at datetime
  # granularity; date is kept for comparability with the reference export, and
  # anchor_time_known records that the time was in fact present.
  granularity: date
  dedup_key: [anchor_date, partition_id]
  rank_field: null

# No cohort label. The reference export encoded has/no embolism in a directory name;
# this one does not encode it anywhere, and an I26.* code in `diagnoses` is a coded
# diagnosis rather than a cohort assignment.
labels: []

omop:
  backend: duckdb
  cdm_version: "5.4"
  person_birth_policy:
    # No waiver needed. The export gives an age together with the CT it was current at,
    # so year_of_birth is derived exactly. Only the day within the year is unknown, and
    # it is not invented.
    mode: strict
  observation_period_rule: "first_to_last_trustworthy_event_date/v1"
  source_name: cu_ctpa
  cdm_holder: null
  source_release_date: null

meds:
  splits: [["train", 0.8], ["tuning", 0.1], ["held_out", 0.1]]
  split_salt: "cu_ctpa/meds-split/v1"
  shard_size: 1
  include_membership_label: false

execution:
  bucket_count: 64
  workers: 4
  chunk_rows: 200000

validation:
  # Thresholds at their defaults. One caveat for ENCOUNTER_RESOLVES: this export
  # delivers no encounter table, and neither visit source (ICU stays, readmissions)
  # carries an arb_encounter_id, so an encounter id here can only ever be matched to
  # another clinical event of the same patient, never to a visit. The notes declare
  # their own rate; if the check resolves against visits alone, every source of this
  # dataset needs a declaration, and this note is where that decision starts.
  note: >-
    defaults; no visit of this export carries an encounter id, so a visit-based
    encounter link rate is 0 for every source by construction (see the comment)

# Files under the prepared root and the raw delivery that no source reads, each with
# its reason, so RAW_COVERAGE_DECLARED can tell "unread on purpose" from "forgotten".
# tools/prepare_cu.py lists the raw delivery's unread files one by one in
# prepare_manifest.json (unread_inputs) with the same reasons.
out_of_scope:
  flowsheets_undated:
    matches: ["flowsheets_undated.parquet"]
    reason: >-
      the flowsheet rows tools/prepare_cu.py found without a date or a time, written
      out so the count is visible rather than lost; 0 rows on the 2026-03 extract
  ct_studies:
    matches: ["ct_studies.parquet"]
    reason: >-
      T1a as delivered, 168,046 accession numbers of the cohort with no date (P-CU5).
      Not a source and not events (D-R16); the imaging manifest is built from it
  imaging_manifest:
    matches: ["imaging_studies.parquet", "imaging_series.parquet"]
    reason: >-
      D-R16 (2026-09-13): the imaging study manifest tools/prepare_cu.py writes and
      the event stream never reads. imaging_studies.parquet is one row per T1a
      accession -- whether image metadata exists for it, the original study date and
      series count from the imaging directory's links.csv, the NIfTI path from
      conversion_summary.csv; imaging_series.parquet is one row per accession x series
      with the series description, number and de-identified DICOM path from
      copy_summary.csv. Patient name, birth date and original patient id columns of
      those files are never projected. Counts are in prepare_manifest.json under
      "imaging"; the OMOP etl_audit and MEDS metadata are where the manifest is meant
      to be recorded (T2.CU7)
  prepare_manifest:
    matches: ["prepare_manifest.json"]
    reason: >-
      the preparation step's own record: sha256 of every raw input, per-step row
      accounting with every drop named, unread files, imaging counts
  delivery_documents:
    matches: ["*.pptx", "*.docx", "*.pdf", "*.xlsx", "*.ipynb", ".ipynb_checkpoints/*", ".idea/*", ".DS_Store", ".~lock*", "__MACOSX/*", "._*", "*.zip"]
    reason: >-
      project documentation (summary deck, ICD/CPT list, requirements workbook, the
      assignment letter), the owner's processing notebook, and the archive, editor and
      OS metadata unpacked with the delivery: no records
  owner_derived_summaries:
    matches: ["patient_level_*_binary_flags.csv", "*_missingness_relative_to_table1.csv", "Table7_medication_name_missing_rate_vs_T1.csv"]
    reason: >-
      per-patient diagnosis flags and coverage statistics the owner's notebook derived
      from T1, T4 and T7, which are read in full; derivations, not records
  imaging_copy_bookkeeping:
    matches: ["links.csv", "copy_summary.csv", "conversion_summary.csv", "not_found_series.csv", "patient_copy_status.csv"]
    reason: >-
      imaging metadata under CU_Images: links.csv, copy_summary.csv and
      conversion_summary.csv are read by tools/prepare_cu.py into the imaging
      manifest with the identifier columns never projected; not_found_series.csv and
      patient_copy_status.csv are the copy step's status files whose facts
      copy_summary.csv already carries per series

owner_answers:
  # Measured 2026-09-13: 1,427,559 groups of identical notes (same patient, day, type
  # and full text) occur in more than one of the three note files, so the files are
  # overlapping pulls and an identical note across files is one event, not two.
  batch_relationship: "one cohort, one extract; the three note files are overlapping pulls of the same notes"
  # Unlike the reference export, the images are here: 553 GB of DICOM and NIfTI for the
  # 2016 and 2017 scans. The *report text* is not: nothing in the export states a CT
  # finding, so no imaging conclusion may be derived from an anchor date.
  imaging_reports_included: false
  imaging_note: >-
    DICOM/NIfTI delivered for the 2016 and 2017 scans and linked by ACCESSIONNUMBER in
    T1a. Radiology report text is not in this extract. T1a carries no date, so the
    accession numbers are not declared as a source; tools/prepare_cu.py writes every
    one of them into imaging_studies.parquet with the original study date and series
    counts the imaging directory's links.csv carries for the roughly 7,500 that have
    images (D-R16), declared out_of_scope above because it is a manifest, not events.
  open_questions:
    readmission_index_event:
      # Measured 2026-09-09, and this is why the question was asked rather than guessed:
      # taken over all rows the flags are not a function of the interval from the CT
      # (flagged rows run from -1 to 4,163 days and unflagged ones from 30 to 4,405,
      # which overlap), nor of the interval from the patient's previous readmission
      # (42,133 unflagged rows sit inside 30 days of one, and 14,584 flagged rows are a
      # first readmission with no previous interval at all).
      #
      # Re-measured 2026-09-11, per patient rather than over all rows. Each patient's
      # first row reproduces from cta_time alone: all five flags for 97.9% of 59,219
      # rows, the 30-day flag for 99.4%, with the boundaries exact -- 7, 30 and 90 days
      # inclusive, six months as a calendar interval (181-184 days), a year as a calendar
      # year (365-366). The rows that do not are the same admission date repeated with a
      # different flag vector: 32,932 admission dates carry two or more, in 32,907 of them
      # exactly one vector is the first scan's, patients with a single T1a accession
      # never carry a repeat, and the number of vectors per date grows with the number
      # of accessions (1.39 for two scans, 3.56 for eight). For two-scan patients the
      # second vector behaves as the interval from one later date in 99.4% of cases. So
      # T5 holds one row per admission x scan, and the export dropped the scan column.
      # Of the 186,349 distinct admission dates, 290 (0.16%) have no vector that agrees
      # with the first scan, all of them one day off a boundary, none far from it.
      question: >-
        Which event are readmission_flag_7day/30day/90day/6months/1year measured from?
        No date in this delivery reproduces them, so they cannot be recomputed, checked,
        or bound to a decision time.
      # Not the owner's answer: the study team's inference (D13, 2026-09-11), from the
      # delivery itself, with the measurements above as its evidence.
      answer: >-
        Each flag is readmission_date within N of a CTPA scan date -- 7, 30 and 90 days
        inclusive, six calendar months, one calendar year -- computed once per admission
        and scan, and the export dropped the scan column. Against the first scan, whose
        timestamp is cta_time, the flags recompute from delivered dates, so a readmission
        label at those horizons is derived from readmission_date and cta_time rather
        than copied from the flags; against later scans they cannot be, because those
        scans' dates were not delivered (T1a carries accession numbers without dates).
        Inferred by the study team on 2026-09-11, not answered by the data owner.
      blocks: "readmission as a downstream label"
    utc_suffix_on_the_cta_timestamp:
      question: >-
        CTA_timestamp is the only column that names a zone and it says UTC, while every
        other date arrives bare. Is the suffix a label on a local clock time, or was that
        one column converted on export?
      # The study team's reading (D15, 2026-09-12) from the delivery itself; the owner
      # has not answered. Pairing 914,951 scan-and-vital-sign rows puts the offset at -1
      # to +1 hours with a median of -32 minutes, which is a scan and its workup on one
      # clock. A true UTC column beside Denver-local vitals would peak at -6 or -7 hours;
      # those bins hold about a tenth of the peak and there is no second mode. Both
      # hour-of-day distributions peak in the afternoon and trough before dawn.
      answer: >-
        The suffix labels the column and does not convert it: CTA_timestamp carries local
        clock time like every other date in this delivery, so America/Denver covers the
        whole extract. Read from the delivery by the study team on 2026-09-12 and put to
        the data owner for confirmation.
      blocks: "nothing; the declared timezone already matches this reading"

    age_reference_date_missing:
      # Measured 2026-09-10 on the full extract: 3 of 127,955 demographics rows carry an
      # age and an empty cta_time. An age says when someone was born only together with
      # the date it was current at, so under the strict birth policy these three had no
      # derivable year of birth. Until 2026-09-11 they were withheld from PERSON, and
      # every clinical row of theirs with them; their events stayed in the canonical
      # layer and in MEDS, and the rows were listed in etl_audit.quality_issue as
      # OMOP_PERSON_BLOCKED. No identifier here.
      question: >-
        What date were the ages of the three patients without a cta_time current at, or
        can their cta_time be supplied?
      # Not the owner's answer: the study team's decision (D12, 2026-09-11), made from the
      # delivery itself. The vitals are a one-day snapshot taken at the scan -- the
      # earliest flowsheet day is the CTA day for 92.0% of the 127,746 patients that
      # have both, and within one day of it for 95.2% -- and for two of the three the
      # notes written on that day state the same age, while the third patient's later
      # note is consistent with it. The extraction date is excluded because later notes
      # already state higher ages. tools/prepare_cu.py applies the rule and counts the
      # rows it touched; cta_time stays empty, so no CT time is invented and the three
      # anchor nothing.
      answer: >-
        The age is taken as current on the patient's earliest flowsheet day, which is
        the day of the inclusion scan for the rest of the cohort. Decided by the study
        team on 2026-09-11 from the delivery's own evidence, not answered by the data
        owner; applied in tools/prepare_cu.py (age_reference_source =
        earliest_flowsheet_day), with cta_time left empty.
      blocks: "OMOP PERSON rows for these three patients, and OMOP_BIRTH_POLICY_ENFORCED"
    temperature_unit:
      # P-CU2 / D-R1. The unit column of every temperature row reads "degree Celsius";
      # the values of `Temp` (67,660 rows, median 98.0, 67,604 in 90-110) and `Core
      # (Body) Temperature` (90 rows, median 98.2, all in 90-110) are Fahrenheit, and
      # only `Temp (in Celsius)` (median 36.7) is what the column says. Executed as
      # Fahrenheit by unit_override on the flowsheets source pending the answer.
      question: >-
        Are the `Temp` and `Core (Body) Temperature` flowsheet values Fahrenheit, as
        their distribution says, although the unit column reads degree Celsius?
      answer: null
      blocks: "nothing; the override stands and every affected event is flagged UNIT_OVERRIDDEN"
  # CPT4 matters here and nowhere else in this repository: 815,466 of this export's
  # 816,628 procedure rows carry one, and Athena ships CPT4 without its names because
  # the AMA licenses them separately, so the bundle is unusable for this dataset until
  # cpt4.jar has filled them in from a UMLS account.
  vocabulary_source: "Athena OMOP vocabulary v5.0 29-AUG-26, CPT4 reconstituted from UMLS 2026-09-09"
  answered_by: null
  answered_on: null
