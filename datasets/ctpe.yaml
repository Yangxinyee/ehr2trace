# Dataset contract for the CTPE export (design section 4).
#
# Everything the converter knows about this particular hospital extract is in this
# file. The package itself contains none of these strings: swapping in a structurally
# similar export means writing another file like this one, not editing code.
#
# Anything this file records as `null` is an open question for the data owner. It stays
# null until they answer, and `ehr2trace inspect` lists it as a blocker.

dataset_id: ctpe
root_env: EHR_DATA_ROOT
description: >-
  CT pulmonary embolism extract: four cohort partitions across two extraction batches,
  delivered as tab-delimited text plus one workbook per partition.

identity:
  person_key: MRN
  encounter_key: CSN
  subject_salt_env: EHR_SUBJECT_SALT

time:
  # Answered by the data owner 2026-08-22: US Eastern. The IANA name, not a fixed
  # offset, because the export spans years and the zone's daylight-saving transitions
  # have to be applied per timestamp rather than assumed away. An hour that occurs
  # twice on a fall-back date resolves to its first occurrence, deterministically.
  timezone_assumption: America/New_York
  naive_time_policy: block
  formats:
    - "%Y-%m-%d %H:%M:%S.%f"
    - "%Y-%m-%d %H:%M:%S"
    - "%Y-%m-%dT%H:%M:%S.%f"
    - "%Y-%m-%dT%H:%M:%S"
    - "%Y-%m-%d"
    - "%m/%d/%Y %H:%M:%S"
    - "%m/%d/%Y"
  null_literals: ["NULL"]

partitions:
  # Directory names are inconsistent between batches, so each is declared explicitly
  # rather than derived from a pattern.
  - id: "29_has"
    dir: "29 - pulmonary embolism/has_embolism"
    membership_label: "has"       # provenance. Not a diagnosis.
    batch: "29"
  - id: "29_no"
    dir: "29 - pulmonary embolism/no_embolism"
    membership_label: "no"
    batch: "29"
  - id: "29b_has"
    dir: "29b - pulmonary embolism/has_pulmonary_embolism"
    membership_label: "has"
    batch: "29b"
  - id: "29b_no"
    dir: "29b - pulmonary embolism/no_pulmonary_embolism"
    membership_label: "no"
    batch: "29b"

terminology:
  # Site-local words that appear inside a medication name and are not part of the drug.
  # `JHH`, `BMC`, `HCGH`, `SMH`, `SOM` and `JHM` are hospitals in this system; `UBER` and
  # `IMS` are order-entry systems; `MBP`, `BEACON` and `PANEL` are order sets. Left in the string
  # they stop the ingredient from being recognised at all, and they are declared here
  # rather than in the converter because the next hospital's list is a different list.
  drug_name_noise:
    - JHH
    - JHM
    - BMC
    - HCGH
    - SMH
    - SOM
    - UBER
    - IMS
    - MBP
    - ZZ
    - BEACON
    - PANEL
    - TEMPLATE

sources:

  all_rx:
    adapter: delimited
    file_glob: "*all_rx.txt"
    options: {delimiter: "\t", encoding: "utf-8-sig"}
    shape: point_event
    event_kind: drug_order
    required: true
    # Not every row of a medication table names a medication. `ZZ IMS TEMPLATE` is an
    # order template, `GENERIC EXTERNAL MEDICATION` a placeholder, and the rest are
    # supplies -- test strips, lancets, a meter, pen needles -- which OMOP would file as
    # devices. Dropped by exact name rather than published as drug exposures that can
    # never resolve (D2, 2026-09-11); the same list applies to administrations.
    row_filter: {column: Medication_Name, drop: ["ZZ IMS TEMPLATE", "GENERIC EXTERNAL MEDICATION", "MISCELLANEOUS MEDICAL SUPPLY MISC", "BLOOD SUGAR DIAGNOSTIC STRIPS", "BLOOD GLUCOSE TEST STRIPS", "LANCETS", "BLOOD-GLUCOSE METER KIT", "PEN NEEDLE, DIABETIC 31 GAUGE X 5/16\"", "PEN NEEDLE, DIABETIC 32 GAUGE X 5/32\""]}
    # Ordering intent. Never merged with administration: a prescribed drug and a given
    # drug are different facts about a patient.
    fields:
      person_id:    {from: [MRN, mrn], required: true}
      encounter_id: {from: [Encounter_CSN, CSN]}
      source_code:  {from: [Medication_Name], required: true}
      source_name:  {from: [Medication_Name]}
      dose:         {from: [HV_Discrete_Dose]}
      event_time:   {from: [Ordering_Date], required: true}
      status:       {from: [Order_Status]}
    # 534,610 of the 15,117,445 order rows (3.5%) have an empty Ordering_Date in the
    # export and are quarantined MISSING_EVENT_TIME. There is no date to recover, so
    # the share is declared as expected rather than left for the check to report
    # (W1, plan section 2.6; measured on the build of 2026-09-11).
    expected_quarantine:
      MISSING_EVENT_TIME:
        max_share: 0.05
        reason: "534,610 of 15,117,445 order rows carry no Ordering_Date in the export; the source has no date for them (W1)"
    # 1,064 merged orders carry one dose written two ways: the same number, spelled
    # differently, under the same lower-cased unit -- which is all the identity keys a
    # drug's dose on (T1.1), so they are one order. 375 of them span the two extraction
    # batches and the rest repeat inside one. The survivor's spelling is kept, the order
    # is flagged, and every spelling stays in the lineage (full build of 2026-09-14).
    merge_rules:
      dose: {rule: keep_all_flag, flag: NAME_VARIANTS_MERGED}
    # The encounter ids this source names resolve to a delivered visit or ADT stay
    # for 63.7% of its orders. The rest name encounters the export never delivered:
    # none links once the id's format is normalized and none names another patient's
    # visit (full build of 2026-09-14). The Outcome sheet holds only the admissions this
    # extract was built around, so the gap is in the delivery, not the parsing.
    expected_encounter_link_rate:
      min_rate: 0.6
      reason: "5,929,050 of 9,308,573 orders (63.7%) name an encounter delivered as a visit or ADT stay; the others name none that was delivered (measured 2026-09-14)"

  medication_admin:
    # One logical source, two physical forms: a standalone file in one partition, a
    # workbook sheet in the others.
    adapter: any_of
    variants:
      - adapter: delimited
        file_glob: "*medication_admin.txt"
        options: {delimiter: "\t", encoding: "utf-8-sig"}
      - adapter: excel
        sheet_aliases: ["Medication Administration"]
    shape: point_event
    event_kind: drug_admin
    required: false
    row_filter: {column: Medication_Name, drop: ["ZZ IMS TEMPLATE", "GENERIC EXTERNAL MEDICATION", "MISCELLANEOUS MEDICAL SUPPLY MISC", "BLOOD SUGAR DIAGNOSTIC STRIPS", "BLOOD GLUCOSE TEST STRIPS", "LANCETS", "BLOOD-GLUCOSE METER KIT", "PEN NEEDLE, DIABETIC 31 GAUGE X 5/16\"", "PEN NEEDLE, DIABETIC 32 GAUGE X 5/32\""]}
    fields:
      person_id:    {from: [MRN, mrn], required: true}
      encounter_id: {from: [CSN, Encounter_CSN]}
      event_time:   {from: [Date_Administered], required: true}
      source_code:  {from: [Medication_Name], required: true}
      source_name:  {from: [Medication_Name]}
      dose:         {from: [Dose]}
      route:        {from: [Route]}
    # The encounter ids this source names resolve to a delivered visit or ADT stay
    # for 80.4% of its administrations. The rest name encounters the export never delivered:
    # none links once the id's format is normalized and none names another patient's
    # visit (full build of 2026-09-14). The Outcome sheet holds only the admissions this
    # extract was built around, so the gap is in the delivery, not the parsing.
    expected_encounter_link_rate:
      min_rate: 0.75
      reason: "1,932,032 of 2,404,496 administrations (80.4%) name an encounter delivered as a visit or ADT stay; the others name none that was delivered (measured 2026-09-14)"

  labs:
    adapter: delimited
    file_glob: "*labs.txt"
    options: {delimiter: "\t", encoding: "utf-8-sig"}
    shape: point_event
    event_kind: measurement
    required: true
    fields:
      person_id:      {from: [MRN, mrn], required: true}
      encounter_id:   {from: [CSN]}
      # Collection time is when the specimen was taken; result time is when anyone
      # could see it. Both are kept, and the fallback is flagged.
      event_time:     {from: [Collection_time, Result_Time], required: true}
      available_time: {from: [Result_Time]}
      anchor_time:    {from: [dos]}          # extraction anchor, never an event time
      anchor_rank:    {from: [Closest_to_CT]}
      source_code:    {from: [Base_Name], required: true}
      source_name:    {from: [Lab_Name]}
      value:          {from: [Value]}
      unit:           {from: [Units]}
      # The reference range the laboratory reported with the result. Filled on
      # 10,009,411 (low) and 10,010,801 (high) of 18,698,432 rows, 53.5%, all but a
      # handful numeric -- not NULL throughout, as an earlier note here claimed
      # (P-J6, T2.J2, measured 2026-09-14). Published as canonical range_low and
      # range_high and OMOP measurement.range_low/range_high since canonical schema 3;
      # before that the roles were read by nothing, and a bound that is not a plain
      # number still stays in the source row.
      value_low:      {from: [Reference_Range_Low]}
      value_high:     {from: [Reference_Range_High]}
    # Arterial pH is the one code whose rows carry no unit at all (332,765 rows); pH is
    # its own UCUM unit and is declared here so the value is not left unitless (T1.7).
    declared_units:
      PHART: pH
    # The same result appears in both extraction batches with a different result time
    # in 14,709 merged groups, 9,384 of them less than an hour apart. The earlier
    # time is when the result first existed; the later one is when the second extract
    # saw it. The earliest is kept and the event flagged AVAILABILITY_MERGED (D-R5,
    # P-J3). Declared even though it is the default, so that the choice is visible here.
    merge_rules:
      available_time: {rule: earliest}
      # 65 merged results carry two display names for one Base_Name code; the code is
      # the result's identity, so the survivor's name is kept, the result is flagged, and
      # every name stays in the lineage. 2 results carry two lower and 3 two upper
      # reference bounds: two ranges for one result contradict each other, so neither is
      # published and both are quarantined (full build of 2026-09-14).
      source_name: {rule: keep_all_flag, flag: NAME_VARIANTS_MERGED}
      # The reference bounds are the canonical range_low and range_high; a rule keyed
      # value_low would address the field that holds a result written as a range.
      range_low:   {rule: null_and_flag}
      range_high:  {rule: null_and_flag}
    ignored_columns:
      rn: "an extraction-time row number, 1 to 5,532, filled on every row and unique neither within a patient nor within a code; it says where the row sat in the extract, not anything about the patient"
    # The encounter ids this source names resolve to a delivered visit or ADT stay
    # for 69.6% of its results. The rest name encounters the export never delivered:
    # none links once the id's format is normalized and none names another patient's
    # visit (full build of 2026-09-14). The Outcome sheet holds only the admissions this
    # extract was built around, so the gap is in the delivery, not the parsing.
    expected_encounter_link_rate:
      min_rate: 0.65
      reason: "6,298,963 of 9,044,430 results (69.6%) name an encounter delivered as a visit or ADT stay; the others name none that was delivered (measured 2026-09-14)"

  problem_list:
    adapter: delimited
    file_glob: "*problem_list.txt"
    options: {delimiter: "\t", encoding: "utf-8-sig"}
    shape: point_event
    event_kind: condition
    code_system: ICD10CM
    required: true
    # Three strings are not diagnoses: two Epic-internal IMO identifiers sit in the code
    # column, and an `ERRONEOUS ENCOUNTER--DISREGARD` placeholder sits in the name
    # column with an empty code -- and an empty code takes the name as its code, so the
    # placeholder has to be named where it actually is. 11,922 rows, dropped by exact
    # value (D3, 2026-09-11).
    row_filter:
      - {column: Diagnosis_Code, drop: ["IMO0001", "IMO0002"]}
      - {column: Diagnosis_Name, drop: ["ERRONEOUS ENCOUNTER--DISREGARD"]}
    # The recorded date is when the problem was first noted, not a disease onset.
    #
    # One cell can hold several codes -- `R78.81, B95.7, Z16.29` is three diagnoses --
    # and matching the whole string finds nothing. 4,836 of 32,467 distinct codes are
    # such cells, carrying 86,468 of 4,256,405 condition rows. Splitting them asserts
    # that the codes are co-equal diagnoses; if the order turns out to rank them, this
    # declaration is where that assumption is recorded and can be revisited.
    code_split:
      separator: ","
      roles: [source_code]
    fields:
      person_id:   {from: [MRN, mrn], required: true}
      source_code: {from: [Diagnosis_Code], required: true}
      source_name: {from: [Diagnosis_Name]}
      event_time:  {from: [First_Noted_Date], required: true}
      status:      {from: [Status]}
    # An entry whose status is Deleted was withdrawn by the clinician who entered it:
    # 30,069 rows (the rest: empty 5,531,824, Active 571,102, Resolved 162,915). Not a
    # diagnosis, so dropped before shaping (D-R6, P-J11).
    excluded_status: [Deleted]
    # The two batches disagree on the status of 45,348 merged entries, mostly an empty
    # cell in one against Active in the other (27,177 groups), then empty against
    # Resolved (6,454), then Active against Resolved (5,430). A recorded status outranks
    # an empty one; Resolved outranks Active because it is the later state of the same
    # problem; Active and Resolved together are a contradiction, and the event is
    # flagged STATUS_CONFLICT (D-R6, P-J2).
    merge_rules:
      status_source: {rule: priority, order: [Resolved, Active], conflict_when: [[Active, Resolved]]}
      # 54,516 merged entries carry two names for one ICD-10 code. The code is what the
      # entry records and what it maps by; the survivor's name is kept, the entry is
      # flagged, and every name stays in the lineage (full build of 2026-09-14).
      source_name: {rule: keep_all_flag, flag: NAME_VARIANTS_MERGED}

  echo:
    adapter: delimited
    file_glob: "*echo.txt"
    options: {delimiter: "\t", encoding: "utf-8-sig"}
    shape: narrative_lines
    event_kind: note
    study_event_kind: procedure
    required: true
    fields:
      person_id:       {from: [mrn, MRN], required: true}
      encounter_id:    {from: [CSN]}
      display_name:    {from: [DESCRIPTION], required: true}
      anchor_time:     {from: [dos]}
      anchor_rank:     {from: [Closest_to_CT]}
      event_time:      {from: [result_time], required: true}
      available_time:  {from: [result_time]}
      result_category: {from: [Rad_Result_type]}
      text_line:       {from: [LINE]}
      text:            {from: [NARRATIVE]}
    # The encounter ids this source names resolve to a delivered visit or ADT stay
    # for 71.0% of its echo report events. The rest name encounters the export never delivered:
    # none links once the id's format is normalized and none names another patient's
    # visit (full build of 2026-09-14). The Outcome sheet holds only the admissions this
    # extract was built around, so the gap is in the delivery, not the parsing.
    expected_encounter_link_rate:
      min_rate: 0.65
      reason: "67,556 of 95,100 echo report events (71.0%) name an encounter delivered as a visit or ADT stay; the others name none that was delivered (measured 2026-09-14)"

  ekg:
    adapter: delimited
    file_glob: "*ekg.txt"
    options: {delimiter: "\t", encoding: "utf-8-sig"}
    shape: component_measurements
    event_kind: measurement
    study_event_kind: procedure
    required: true
    # One component is the name of the reading physician, not a result: a person's
    # name in a measurement value, 1,136 rows. Dropped (2026-09-11).
    row_filter: {column: Component_Name, drop: ["PHYSICIAN INTERPRETER"]}
    fields:
      person_id:      {from: [MRN, mrn], required: true}
      encounter_id:   {from: [CSN]}
      display_name:   {from: [Procedure_Name], required: true}
      anchor_time:    {from: [dos]}
      anchor_rank:    {from: [Closest_to_CT]}
      event_time:     {from: [Result_Time], required: true}
      available_time: {from: [Result_Time]}
      source_code:    {from: [Component_Name], required: true}
      text_line:      {from: [Line]}
      value:          {from: [Result_Value]}
    # The ECG export has no unit column at all: 4,114,733 numeric results, every one of
    # them unitless (P-J7, T2.J3). What each number is in is fixed by what the component
    # is, and the cart's own naming convention says which: a RATE is beats per minute, a
    # DURATION or an INTERVAL is what the cart prints in milliseconds, an AXIS is degrees
    # of the frontal plane, and the two pressures recorded with the tracing are mmHg. The
    # measured values agree: the rates have median 84, the QRS durations median 90, the
    # QT intervals median 384, the corrected QT median 451 -- none of which is a number in
    # any other unit. Every value carrying one of these flags UNIT_DECLARED, so a reader
    # can always tell a unit this file asserted from one the hospital sent.
    #
    # `ECG <name>` is the same measurement under the second batch's spelling; both are
    # declared because a source code is the string the export wrote, not a tidied one.
    declared_units:
      "VENTRICULAR RATE":        bpm
      "ATRIAL RATE":             bpm
      "ECG HEART RATE":          bpm
      "QRS DURATION":            ms
      "ECG QRS DURATION":        ms
      "ECG P DURATION":          ms
      "P-R INTERVAL":            ms
      "ECG PR INTERVAL":         ms
      "Q-T INTERVAL":            ms
      "Q-T  INTERVAL":           ms    # the same component, written with two spaces
      "Q-T INTERVA":             ms    # and with its name cut short by the export
      "ECG QT INTERVAL":         ms
      "Q-T DISPERSION":          ms
      "QTC CALCULATION (BEZET)": ms
      "QTC CALCULATION(BEZET)":  ms
      "ECG QTC INTERVAL":        ms
      "ECG RR INTERVAL":         ms
      "P AXIS":                  degrees
      "R AXIS":                  degrees
      "T AXIS":                  degrees
      "ECG P AXIS":              degrees
      "ECG QRS AXIS":            degrees
      "ECG T AXIS":              degrees
      "SYSTOLIC BP":             mmHg
      "DIASTOLIC BP":            mmHg
    # DIAGNOSIS, DIAGNOSIS LINE, DIAGNOSIS CLASS and ECG REPORT are the cart's text, not
    # measurements, and get no unit. 27 of those rows were read as a number followed by a
    # unit -- `2 to 1 AV block` became 2 `to 1 AV block` (P-J8). None of those tails is a
    # unit in `reference/units/`, so they stop parsing as values once T1.9 lands; nothing
    # is declared here to make that happen.
    # The encounter ids this source names resolve to a delivered visit or ADT stay
    # for 87.9% of its ECG values. The rest name encounters the export never delivered:
    # none links once the id's format is normalized and none names another patient's
    # visit (full build of 2026-09-14). The Outcome sheet holds only the admissions this
    # extract was built around, so the gap is in the delivery, not the parsing.
    expected_encounter_link_rate:
      min_rate: 0.85
      reason: "6,151,538 of 6,994,520 ECG values (87.9%) name an encounter delivered as a visit or ADT stay; the others name none that was delivered (measured 2026-09-14)"

  demographics:
    adapter: excel
    sheet_aliases: ["Demographics"]
    shape: person_attributes
    event_kind: demographic
    required: true
    fields:
      person_id:    {from: [MRN, mrn], required: true}
      age:          {from: [Age]}
      gender:       {from: [Gender]}
      race:         {from: [Race]}
      ethnicity:    {from: [Ethnicity]}
      vital_status: {from: [Status]}
      death_time:   {from: [Death_Date]}
    # Real measurements with no measurement time anywhere in the export. Quarantined
    # rather than dated by guesswork; publish them only once the data owner supplies a
    # trustworthy time-association rule.
    untimed_values:
      - {column: BMI, code: BMI, unit: "kg/m2"}
      - {column: Pulse, code: PULSE, unit: "/min"}
      - {column: BP_Systolic, code: BP_SYSTOLIC, unit: "mm[Hg]"}
    # Both of these are the export, not the converter, and both are far past the 5%
    # the checks complain at, so both are declared (plan section 2.6, T0.2). The three
    # untimed vital signs above produce up to three quarantined values per patient --
    # 92,005 from 30,971 rows -- so no share below 1 can bound them. The vital status is
    # the `Status` column, which says whether a patient is alive without saying when it
    # was true: 23,979 of 30,971 rows, 77%. Neither is given a time by guesswork.
    expected_quarantine:
      UNTIMED_CLINICAL_VALUE:
        max_share: 1.0
        reason: "the BMI, pulse and systolic pressure this sheet carries have no measurement time anywhere in the export; 92,005 values from 30,971 rows, up to three per patient (measured on the build of 2026-09-11)"
      UNTIMED_VITAL_STATUS:
        max_share: 0.8
        reason: "23,979 of 30,971 rows state a vital status with no date it was true as of; 77.4%"

  outcome:
    adapter: excel
    sheet_aliases: ["Outcome"]
    shape: visit
    event_kind: visit
    required: false
    fields:
      person_id:       {from: [MRN, mrn], required: true}
      encounter_id:    {from: [CSN]}
      event_time:      {from: [Hosp_Admsn_Time, Date_of_Service], required: true}
      visit_type:      {from: [Hospital_Visit_Type]}
      length_of_stay:  {from: [Length_of_stay_days]}
      # A masked duration string; kept verbatim, never parsed as a duration.
      duration_masked: {from: [Time_Difference]}
      death_time:      {from: [Death_Date]}
    # 8,032 admissions arrive in two extracts with two different masked durations. A
    # masked string cannot be compared or ordered, so neither is chosen: the visit
    # publishes no duration, both values are quarantined, and the visit is flagged --
    # the rule the ADT stays already use for the same field (D-R4; full build of
    # 2026-09-14).
    merge_rules:
      duration_masked: {rule: null_and_flag}
    expected_quarantine:
      VALUE_CONFLICT:
        max_share: 0.55
        reason: >-
          The rule above quarantines each row's masked duration wherever an admission's
          two extracts disagree on it: 8,032 admissions, whose rows are 49.5% of this
          sheet's rows on the full build of 2026-09-14. The visit is still published;
          only its duration is withheld.

  pft_narrative:
    adapter: excel
    # The same sheet is named differently across partitions.
    sheet_aliases: ["PFT Narrative", "PFT"]
    options: {skip_unnamed_leading_columns: true}
    shape: narrative_lines
    event_kind: note
    study_event_kind: procedure
    required: false
    fields:
      person_id:       {from: [mrn, MRN], required: true}
      encounter_id:    {from: [CSN]}
      display_name:    {from: [DESCRIPTION], required: true}
      anchor_time:     {from: [dos]}
      anchor_rank:     {from: [Closest_to_CT]}
      event_time:      {from: [result_time], required: true}
      available_time:  {from: [result_time]}
      result_category: {from: [Rad_Result_type]}
      text_line:       {from: [LINE]}
      text:            {from: [NARRATIVE]}
    # The encounter ids this source names resolve to a delivered visit or ADT stay
    # for 12.2% of its PFT report events. The rest name encounters the export never delivered:
    # none links once the id's format is normalized and none names another patient's
    # visit (full build of 2026-09-14). The Outcome sheet holds only the admissions this
    # extract was built around, so the gap is in the delivery, not the parsing.
    expected_encounter_link_rate:
      min_rate: 0.1
      reason: "3,708 of 30,272 PFT report events (12.2%) name an encounter delivered as a visit or ADT stay; the others name none that was delivered (measured 2026-09-14)"

  pft_values:
    adapter: excel
    sheet_aliases: ["PFT Values", "PFT Value"]
    shape: component_measurements
    event_kind: measurement
    study_event_kind: procedure
    required: false
    fields:
      person_id:      {from: [MRN, mrn], required: true}
      encounter_id:   {from: [CSN]}
      display_name:   {from: [Procedure_Name], required: true}
      anchor_time:    {from: [dos]}
      anchor_rank:    {from: [Closest_to_CT]}
      event_time:     {from: [Result_Time], required: true}
      available_time: {from: [Result_Time]}
      source_code:    {from: [Component_Name], required: true}
      text_line:      {from: [Line]}
      value:          {from: [Result_Value]}
    # The PFT values sheet has no unit column either: 107,550 numeric results with
    # nothing saying what they are in (P-J7, T2.J3). Two reporting systems wrote into it
    # and each has its own naming convention, which is what the units are read from:
    #
    #   `<measure>_ZBD` / `_AFD`   the measured value before / after bronchodilator, in
    #                              the measure's own unit (FVC_ZBD median 2.31, FEV1_ZBD
    #                              1.70, TLC_ZBD 4.01 -- litres);
    #   `<measure>_PPR` / `_APP`   the same measure as a percentage of predicted
    #                              (FEV1_PPR median 67, FVC_APP 81);
    #   `<MEASURE>-PRE|PRED|POST`  the second system's measured, predicted and
    #                              post-bronchodilator values, again in the measure's own
    #                              unit (FEV1-PRE median 1.83, TLCPLETH-PRE 3.39);
    #   `<MEASURE>-%PRED-PRE|POST` that system's percentage of predicted (median 49-76).
    #
    # Volumes are litres, flows litres per second, ratios and percentages of predicted
    # percent, diffusing capacity mL/min/mmHg and per litre of alveolar volume for DL/VA,
    # the breath-hold time seconds, and the walk tests carry their unit in their own name.
    # Each declaration flags the value UNIT_DECLARED.
    declared_units:
      # volumes
      "FVC_ZBD":                    L
      "FEV1_ZBD":                   L
      "FVC_AFD":                    L
      "FEV1_AFD":                   L
      "TLC_ZBD":                    L
      "RV_ZBD":                     L
      "FVC-PRE":                    L
      "FVC-PRED":                   L
      "FVC-POST":                   L
      "FEV1-PRE":                   L
      "FEV1-PRED":                  L
      "FEV1-POST":                  L
      "FEV05-PRE":                  L
      "FEV05-POST":                 L
      "FIVC-PRE":                   L
      "FIVC-POST":                  L
      "IVC-PRE":                    L
      "SVCSB-PRE":                  L
      "TLC-PRE":                    L
      "TLC-PRED":                   L
      "TLCPLETH-PRE":               L
      "TLCPLETH-PRED":              L
      "RVPLETH-PRE":                L
      "RVPLETH-PRED":               L
      "TGVPLETH-PRE":               L
      "TGVPLETH-PRED":              L
      "VA-PRE":                     L
      "VA-PRED":                    L
      "FVC PREDICTED, EXTERNAL":    L
      "FEV1 PREDICTED, EXTERNAL":   L
      "FEV1, EXTERNAL":             L
      # flows
      "FEF25_75_ZBD":               L/s
      "FEF2575-PRE":                L/s
      "FEF2575-PRED":               L/s
      "FEF2575-POST":               L/s
      "FEF25-PRE":                  L/s
      "FEF25-PRED":                 L/s
      "FEF25-POST":                 L/s
      "FEF50-PRE":                  L/s
      "FEF50-PRED":                 L/s
      "FEF50-POST":                 L/s
      "FEF75-PRE":                  L/s
      "FEF75-PRED":                 L/s
      "FEF75-POST":                 L/s
      "FEFMAX-PRE":                 L/s
      "FEFMAX-PRED":                L/s
      "FEFMAX-POST":                L/s
      "FIFMAX-PRE":                 L/s
      "FIFMAX-POST":                L/s
      "FIF2575-PRE":                L/s
      "FIF2575-POST":               L/s
      "FEF2001200-PRE":             L/s
      "FEF2001200-POST":            L/s
      # ratios and percentages of predicted
      "FEV1OFVC_ZBD":               "%"
      "FEV1OFVC_AFD":               "%"
      "FEV1_PPR":                   "%"
      "FVC_PPR":                    "%"
      "FEF25_75_PPR":               "%"
      "DLCO_UNC_PPR":               "%"
      "TLC_PPR":                    "%"
      "RV_PPR":                     "%"
      "FEV1_APP":                   "%"
      "FVC_APP":                    "%"
      "FEV1/FVC-PREDICTED":         "%"
      "FEV1FVC-PREDICTED":          "%"
      "FEV1FVC-POST":               "%"
      "FVC-%PRED-PRE":              "%"
      "FVC-%PRED-POST":             "%"
      "FEV1-%PRED-PRE":             "%"
      "FEV1-%PRED-POST":            "%"
      "FEF2575-%PRED-PRE":          "%"
      "FEF2575-%PRED-POST":         "%"
      "RVPLETH-%PRED-PRE":          "%"
      "TLCPLETH-%PRED-PRE":         "%"
      "DLCOUNC-%PRED-PRE":          "%"
      "DLCOUNC-%PRED-POST":         "%"
      "DLCOCOR-%PRED-PRE":          "%"
      "DLCOCOR-%PRED-POST":         "%"
      "RVTLCSB-PRE":                "%"
      "RVTLCSB-POST":               "%"
      "RVTLCPL-PRE":                "%"
      "RV/TLC - PRE PREDICTED":     "%"
      "RV/TLC - % PRE PREDICTED":   "%"
      "DLCO % PREDICTED, EXTERNAL": "%"
      # diffusing capacity
      "DLCO_UNC_ZBD":               mL/min/mmHg
      "DLCOUNC-PRE":                mL/min/mmHg
      "DLCOUNC-PRED":               mL/min/mmHg
      "DLCOUNC-POST":               mL/min/mmHg
      "DLCOCOR-PRE":                mL/min/mmHg
      "DLCOCOR-PRED":               mL/min/mmHg
      "DLCOCOR-POST":               mL/min/mmHg
      "DLCO, EXTERNAL":             mL/min/mmHg
      "DLVA-PRE":                   mL/min/mmHg/L
      "DLVA-PRED":                  mL/min/mmHg/L
      # time and distance, where the component name already says the unit
      "BHT-PRE":                    seconds
      "6MW_RA_METERS":              m
      "6MW_O2_METERS":              m
      "6MW_RA_FEET":                feet
      "6MW_O2_FEET":                feet
    # Left undeclared on purpose, 56 rows: FEF50FVC-PRE/PRED/POST is a flow divided by a
    # volume, which is a reciprocal time, and the sheet does not say whether this system
    # writes it per second or as a percentage; FEF50FIF50-PRE/PRED/POST is a
    # dimensionless expiratory-to-inspiratory flow ratio that is written both as a
    # fraction and as a percentage by different carts. Both stay UNIT_UNKNOWN until
    # someone with the report can say which, rather than being guessed at here.
    # The remaining unitless codes are the four procedure names (JHOC/BAYVIEW/GSS/JHCP
    # PULMONARY FUNCTION TEST(S) and the paediatric one), which carry no value.
    # The encounter ids this source names resolve to a delivered visit or ADT stay
    # for 17.6% of its PFT values. The rest name encounters the export never delivered:
    # none links once the id's format is normalized and none names another patient's
    # visit (full build of 2026-09-14). The Outcome sheet holds only the admissions this
    # extract was built around, so the gap is in the delivery, not the parsing.
    expected_encounter_link_rate:
      min_rate: 0.15
      reason: "20,662 of 117,370 PFT values (17.6%) name an encounter delivered as a visit or ADT stay; the others name none that was delivered (measured 2026-09-14)"

  # -- delivered in the second tree, All_kinds/, and projected by tools/prepare_ctpe.py --
  #
  # Both of these live under CTPE_PREPARED_ROOT rather than the raw export, in the same
  # four partition directories. `tools/prepare_ctpe.py` writes them and refuses to write
  # at all if the four groups differ in format, so that nothing about a row's shape can
  # tell a model which cohort it came from. Running any ctpe command therefore needs
  # CTPE_PREPARED_ROOT set; the loader says so by name if it is missing.

  followup:
    adapter: parquet
    root_env: CTPE_PREPARED_ROOT
    file_glob: "followup.parquet"
    shape: point_event
    event_kind: observation
    required: false
    # The most recent contact the health system recorded with this patient: 30,968 rows
    # across the four groups, 22,979 patients, and exactly one date per patient once the
    # groups are merged. It is not a diagnosis, a measurement or a procedure, which is
    # what `observation` is for. Two things make it worth carrying: it is the censoring
    # date a survival analysis needs, and the observation-period rule already runs to the
    # last trustworthy event, so a follow-up contact extends the window to where the
    # record really ends instead of to the last laboratory result (D-R12, T2.J7, P-J4).
    #
    # The code is the constant the preparation step projects. The delivery states the
    # fact by which table the row is in, and an event needs a code to be publishable, so
    # the code is written once in the projection rather than invented here.
    fields:
      person_id:      {from: [PAT_MRN_ID], required: true}
      source_code:    {from: [observation_code], required: true}
      source_name:    {from: [observation_code]}
      event_time:     {from: [EFFECTIVE_DATE_DTTM], required: true}
      available_time: {from: [EFFECTIVE_DATE_DTTM]}
    ignored_columns:
      rn: "the rank of the contact within the patient. The delivery already kept only the most recent one, so the column is the constant 1 on all 30,968 rows and says nothing a row does not already say"

  icu_transfers:
    adapter: parquet
    root_env: CTPE_PREPARED_ROOT
    file_glob: "icu_transfers.parquet"
    shape: visit
    # A department stay is a stay *inside* an admission, not an admission: OMOP has
    # VISIT_DETAIL for exactly this, and publishing 946,025 of them as visits would
    # invent that many hospitalisations (D-R14, T2.J7).
    event_kind: visit_detail
    required: false
    # 1,523,224 ADT rows across the four groups, covering 22,914 of the 22,980 published
    # patients; 946,025 events once the same stay delivered in both batches collapses.
    fields:
      person_id:       {from: [PAT_MRN_ID], required: true}
      encounter_id:    {from: [PAT_ENC_CSN_ID]}
      event_time:      {from: [IN_DTTM], required: true}
      end_time:        {from: [PAT_OUT_DTTM]}
      # The department is what kind of stay this was, in the hospital's own words: 241
      # names, each with exactly one department id behind it. Kept verbatim rather than
      # reduced to an ICU/not-ICU label, because the label is already delivered beside it
      # and collapsing 241 names into 2 would throw away the ward a patient was on.
      visit_type:      {from: [ADT_DEPARTMENT_NAME]}
      # d:hh:mm:ss as delivered, kept as text and never parsed as a duration -- the same
      # treatment the identically named column gets in `outcome`.
      duration_masked: {from: [Time_Difference]}
    # The site says which of the 241 departments is meant (they repeat across hospitals),
    # and the hospital's own ICU flag is evidence a department name alone does not carry:
    # 22 departments are flagged, 8 of them named only by building and floor.
    keep_columns: [ADT_LOC_NAME, ICU_DEPT_YN]
    # 10,828 of the 946,025 stays are delivered twice with a different departure time.
    # The arrival is recorded to the second, so these are the same stay disagreeing about
    # when it ended, not two stays: keep the arrival, publish no departure, flag the
    # event and quarantine both values (D-R4). The stay length disagrees exactly when the
    # departure does, and is withheld with it rather than left pointing at one of them.
    merge_rules:
      end_time:        {rule: null_and_flag}
      duration_masked: {rule: null_and_flag}
    # The ADT table is the patient's whole department history; the `Outcome` sheet holds
    # only the 25,573 encounters this extract was built around. So 91% of these encounter
    # ids are real -- they appear on other events of the same patient -- but only 13.29%
    # of the stays name an encounter that was delivered as a visit. That is a gap in the
    # delivery, not a parsing failure, and it is declared rather than treated as one.
    expected_encounter_link_rate:
      min_rate: 0.12
      reason: "13.29% of the 946,025 stays carry an encounter id that was delivered as a visit; the ADT table spans 226,608 encounters and the Outcome sheet only 25,573 (measured 2026-09-14)"
    ignored_columns:
      ADT_DEPARTMENT_ID: "the numeric key of ADT_DEPARTMENT_NAME: 241 ids, 241 names, one to one, so it identifies nothing the name does not. NULL on the 358,928 post-discharge rows, which belong to no department"
      NAME: "not a name of a person and not a name of a department: 4 distinct values over 1,523,224 rows, in three masked shapes (aaaaaaaa aa, aaaaaaaaa x2, aaaaa aa aaaaaaa aaaaaa), which is the ADT event vocabulary saying how the stay began. It could be carried as the `action` role; it is left out until someone decides that, because this file's instruction was to project it only if it were a department name, and it is not"

anchors:
  anchor_type: ctpa
  from_field: anchor_time
  # One batch carries a full timestamp, the other only a date, so anchors are compared
  # at date granularity and the missing time component is recorded per anchor.
  granularity: date
  dedup_key: [anchor_date, partition_id]
  rank_field: anchor_rank

labels:
  - id: pulmonary_embolism
    # Demonstrated by the data, not assumed: one patient appears in both a "has" and a
    # "no" partition of the same batch, with different CT episodes in each.
    scope: episode
    from: membership_label
    requires_anchor: true
    definition_status: undefined

omop:
  backend: duckdb
  cdm_version: "5.4"
  person_birth_policy:
    # The export carries an age but no birth date and no as-of date, so a compliant
    # year_of_birth cannot be derived. Strict mode blocks PERSON rather than inventing
    # one; canonical and MEDS are unaffected.
    #
    # Evidence gathered 2026-08-21, kept because it qualifies what follows:
    #   - the last clinical event in the data is 2024-07-08
    #   - the raw files were exported 2024-09-19
    # Both precede the approved reference date, so if the ages were in fact computed at
    # extraction time, every derived year_of_birth here is one year too early. Only the
    # year of this date matters; the day does not.
    mode: approved_approximation
    age_as_of_date: "2025-03-01"
    approval_note: >-
      Approved by the project owner on 2026-08-22 to use 2025-03-01 as the reference
      date for the recorded ages. The discrepancy above was raised before approval and
      the date was reaffirmed. Every derived birth year is flagged
      DERIVED_APPROXIMATE_BIRTH_YEAR and may be off by one year regardless, because
      whether the birthday had passed is unknown.
  observation_period_rule: "first_to_last_trustworthy_event_date/v1"
  source_name: ctpe
  # CDM_SOURCE requires these and the data does not carry them.
  cdm_holder: null
  source_release_date: null

meds:
  splits: [["train", 0.8], ["tuning", 0.1], ["held_out", 0.1]]
  split_salt: "ctpe/meds-split/v1"
  shard_size: 1
  include_membership_label: false

execution:
  bucket_count: 64
  workers: 4
  chunk_rows: 200000

validation:
  # Thresholds are the remediation plan's defaults. One of them is known to fail here and
  # is left failing on purpose: a department stay's `visit_type` is one of 241 site-local
  # ward names, and only the 14 whose name actually says ICU or INTENSIVE CARE are mapped
  # (the other 8 flagged as ICU are named by building and floor, and are in the review
  # queue). Lowering the number would hide a real gap; the queue is where it gets closed.
  note: >-
    visit_detail_concept_coverage_min is expected to fail until the ADT department
    names are reviewed: 14 of 241 are mapped as of 2026-09-14.

# Delivered tables this conversion deliberately does not read (D-R12, decided 2026-09-13).
# Paths are under the second delivery tree, `All_kinds/`, beside the two tables
# tools/prepare_ctpe.py does read; that script lists every file it skipped, with the same
# reasons, in its own manifest, so the two cannot drift apart silently.
out_of_scope:
  surgical_pathology_reports:
    matches: ["All_kinds/Surgical Pathology Reports/**"]
    reason: >-
      Surgical pathology report text, 131-159 MB per group. Free-text pathology is a
      conversion of its own -- it needs a section parser and a terminology pass before any
      of it is a fact -- and nothing in this cohort's questions turns on it.
  cardiac_cath:
    matches: ["All_kinds/Cardiac Cath/**"]
    reason: >-
      Catheterisation reports covering about 11% of patients, at the same proportion in
      each group. A finding present for one patient in nine cannot support a cohort-level
      claim, and the text needs the same parser the pathology reports do.
  lipid_panel:
    matches: ["All_kinds/Labs - Lipid Panel/**"]
    reason: >-
      Lipid results, 109,000-191,000 rows per group, covering about 70% of patients. They
      are laboratory values the main `labs` table does not carry, and they could be
      included later; they are out of scope now because no question in this cohort asks
      about lipids and each new code needs its own unit and range declarations.
  icu_progress_notes:
    matches:
      - "All_kinds/ICU/ICU/*_notes.txt"
      - "All_kinds/ICU/ICU/*_note.txt"
      - "All_kinds/ICU/ICU/29b_pulmonary_embolism.txt"
    reason: >-
      ICU progress-note text, about 33.6 GB in four files for this cohort. They have no
      header row -- the note text starts at byte 0 -- and they hold emergency, admission
      and pre-procedure notes as well, so which note a block of text is cannot be told
      without a parser nobody has written. Never opened.
  surgical_cases:
    matches: ["All_kinds/Surgical Cases/**"]
    reason: >-
      Surgical case lists, 30-77 rows per group. Too few rows to support anything, and the
      delivery is wrong: `29_pulmonary_embolism.xlsx` has the same row count as the 29_no
      file and every one of its MRNs belongs to 29_no, so it is a copy and the 29_has list
      is missing (P-J12). Raised with the data owner 2026-09-13; still unanswered.
  other_cohorts:
    matches:
      - "All_kinds/**/28_*"
      - "All_kinds/**/28a_*"
      - "All_kinds/**/30b_*"
      - "All_kinds/**/33b_*"
      - "All_kinds/**/35_*"
      - "All_kinds/Ultrasound/**"
      - "All_kinds/Most Recent Follow-Up/Most Recent Follow-Up/followup.xlsx::28_*"
      - "All_kinds/Most Recent Follow-Up/Most Recent Follow-Up/followup.xlsx::28a_*"
      - "All_kinds/Most Recent Follow-Up/Most Recent Follow-Up/followup.xlsx::30b_*"
      - "All_kinds/Most Recent Follow-Up/Most Recent Follow-Up/followup.xlsx::33b_*"
      - "All_kinds/Most Recent Follow-Up/Most Recent Follow-Up/followup.xlsx::35_*"
    reason: >-
      Another cohort's tables, delivered in the same tree: coronary CT (28, 28a), cardiac
      MRI (30b), cholecystitis ultrasound (33b) and ED head CT (35). Not these patients.
      The follow-up workbook holds one worksheet per cohort, so the same rule names the
      sheets as well as the files.
  archive_metadata:
    matches: ["All_kinds/**/__MACOSX/**"]
    reason: "AppleDouble resource forks macOS wrote when the archive was made; not data."
  prototype_extracts:
    matches: ["data-test/**", "data-test-v2/**"]
    reason: >-
      Two hand-built prototypes that sit beside the partition directories under
      EHR_DATA_ROOT: per-patient timelines and reports for three patients, with the
      scripts that made them. Derived from the same export, not part of it, and superseded
      by this converter.

owner_answers:
  # Answered by the data owner 2026-08-21: one cohort, exported twice. The two extracts
  # differ in places, and the union of both is what is wanted. That is what the pipeline
  # already does -- identity is resolved across all four partitions before deduplication,
  # and the same clinical fact appearing in both batches collapses to one event with
  # every source row still linked.
  batch_relationship: "one cohort exported twice; take the union of both extracts"
  # Partially answered 2026-08-22: the images exist, but are held elsewhere for size and
  # are not part of this delivery. Whether the *radiology report text* exists is not yet
  # known. That text is what would become NOTE events and what an anchor date currently
  # stands in for, so the question stays open until someone checks.
  imaging_reports_included: false
  imaging_note: >-
    Images exist off-site and are not delivered here. Report text unconfirmed. Nothing in
    this extract contains a CT finding, so no imaging conclusion may be derived from an
    anchor date or a partition name.
  vocabulary_source: "Athena OMOP vocabulary v5.0 29-AUG-26, CPT4 reconstituted from UMLS 2026-09-09"
  answered_by: null
  answered_on: null
